[package]
name = "litecrazy"
version = "1.0.3"
edition = "2024"
license = "MIT"
authors = ["cnst <mail@cnst.dev>"]
description = "Battery tray icon for the Pulsar X2 CrazyLight, with a shortcut to the web configurator"
repository = "https://github.com/cnsta/litecrazy"
readme = "README.md"
keywords = ["mouse", "pulsar", "hid", "tray", "battery"]
categories = ["hardware-support"]

[dependencies]
# Core
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

# USB/HID
hidapi = "2.6"

# Tray
ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", features = ["blocking"] }
notify-rust = { version = "4.11", default-features = false, features = ["d"] }
ctrlc = "3.5"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "user"] }

[build-dependencies]
resvg = "0.47"

[lib]
name = "litecrazy"
path = "src/lib.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
